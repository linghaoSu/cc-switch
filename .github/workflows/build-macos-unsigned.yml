# Unsigned Apple Silicon build of the Copilot patch branch. The upstream release
# workflow needs Apple and Tauri signing secrets that a fork does not have.
name: Build macOS (unsigned)

on:
  push:
    branches: [copilot-claude-messages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned macOS app (arm64)
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm tauri build --bundles app --no-sign

      - name: Ad-hoc sign and zip
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          zip="$RUNNER_TEMP/cc-switch-copilot-patch-${version}-macos-arm64.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=cc-switch-copilot-patch-${version}-macos-arm64" >> "$GITHUB_OUTPUT"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
